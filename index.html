<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صحراء</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#150f2a;--surf:#241a44;--surf2:#2f2358;--line:#3a2d68;--tx:#f7f0e6;--mut:#b2a7d3;--gold:#ffc46b;--ember:#ff7a45;--mint:#4fe3c1;--on:#2a1604;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbf3e6;--surf:#fff;--surf2:#f3e6cf;--line:#ead9b8;--tx:#2a1d12;--mut:#7b6a52;--gold:#b8742a;--ember:#d9531b;--mint:#0f9b80;--on:#fff}}
:root[data-theme="light"]{--bg:#fbf3e6;--surf:#fff;--surf2:#f3e6cf;--line:#ead9b8;--tx:#2a1d12;--mut:#7b6a52;--gold:#b8742a;--ember:#d9531b;--mint:#0f9b80;--on:#fff}
:root[data-theme="dark"]{--bg:#150f2a;--surf:#241a44;--surf2:#2f2358;--line:#3a2d68;--tx:#f7f0e6;--mut:#b2a7d3;--gold:#ffc46b;--ember:#ff7a45;--mint:#4fe3c1;--on:#2a1604}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;max-width:560px;margin:auto;position:relative;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,.brand{font-family:"Reem Kufi",Tajawal,sans-serif;font-weight:700}
.view{display:none;height:100%}.view.on{display:flex;flex-direction:column}
.av{--h:20;width:var(--s,44px);height:var(--s,44px);flex:none;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--s,44px)*.5);background:linear-gradient(135deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 50) 70% 42%))}
/* login */
#login{justify-content:flex-end;align-items:center;text-align:center;padding:24px 24px 34px;gap:12px;background:radial-gradient(120% 70% at 50% 0,#5b2aa8 0,#2a1560 45%,var(--bg) 80%)}
#login .art{width:100%;max-width:380px;margin-top:auto}
#login h1{font-size:4rem;line-height:1;color:#ffd48a}
#login p{color:#d9cdf5;max-width:28ch;line-height:1.7}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;background:#fff;color:#2a2a2a;border-radius:30px;padding:14px 18px;font-weight:700;margin-top:8px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.fine{font-size:.78rem;color:#b9abdf}
/* app */
#app header{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
#app header .hi{flex:1}.hi small{color:var(--mut);display:block}.hi h2{font-size:1.45rem}
.pill{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-weight:700;font-size:.9rem}
main{flex:1;overflow-y:auto;padding:6px 18px 96px;min-height:0}
.tab{display:none}.tab.on{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.chip{flex:none;padding:7px 16px;border-radius:20px;background:var(--surf);border:1px solid var(--line);color:var(--mut)}
.chip.on{background:var(--ember);border-color:var(--ember);color:var(--on);font-weight:700}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;margin-bottom:16px;width:100%;text-align:right;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.hero .big{position:absolute;inset-inline-start:-6px;top:-10px;font-size:7.5rem;opacity:.28}
.hero h3{font-size:1.6rem}.hero small{opacity:.9}
.live{display:inline-flex;align-items:center;gap:6px;width:fit-content;background:rgba(0,0,0,.35);border-radius:12px;padding:2px 10px;font-size:.78rem}
.live i{width:8px;height:8px;border-radius:50%;background:#ff4d4d;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.sec{display:flex;justify-content:space-between;margin:4px 0 10px}.sec h3{font-size:1.15rem}.sec span{color:var(--mut);font-size:.85rem}
.rc{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px}
.cov{width:62px;height:62px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:1.9rem;background:linear-gradient(135deg,var(--g1),var(--g2))}
.rc .in{flex:1;min-width:0}.rc b{display:block;font-size:1.02rem}.rc small{color:var(--mut)}
.stack{display:flex;margin-top:6px}.stack .av{border:2px solid var(--surf);margin-inline-end:-8px}
.cnt{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mint);font-weight:700;font-size:.85rem}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--mint);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(1){height:6px}.eq i:nth-child(2){height:14px;animation-delay:.2s}.eq i:nth-child(3){height:9px;animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.4)}}
@media (prefers-reduced-motion:reduce){.eq i,.live i,.seat.talk .av{animation:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm{border-radius:22px;padding:16px;min-height:150px;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));position:relative;overflow:hidden}
.gm .big{position:absolute;top:8px;inset-inline-start:10px;font-size:3rem}.gm b{font-size:1.05rem}.gm small{opacity:.9}
.gm.w{grid-column:span 2;min-height:110px}
.chat-i{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:11px 4px;border-bottom:1px solid var(--line)}
.chat-i .in{flex:1;min-width:0}.chat-i b{display:block}.chat-i small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-i .tm{color:var(--mut);font-size:.75rem;text-align:center}.unr{display:block;margin:4px auto 0;width:20px;height:20px;border-radius:50%;background:var(--ember);color:var(--on);font-size:.75rem;line-height:20px;font-weight:700}
.cover{height:120px;border-radius:24px;background:linear-gradient(135deg,#ff7a45,#7a2fd0 70%,#2a1560)}
.prof{text-align:center;margin-top:-48px}.prof .av{border:4px solid var(--bg);margin:0 auto 8px}
.prof h3{font-size:1.4rem}.prof p{color:var(--mut)}
.stats{display:flex;margin:16px 0;background:var(--surf);border:1px solid var(--line);border-radius:20px}
.stats div{flex:1;padding:12px 0}.stats b{display:block;font-size:1.3rem;color:var(--gold)}.stats small{color:var(--mut)}
.row{display:block;width:100%;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;text-align:right}.row.out{color:var(--ember)}
.fab{position:absolute;inset-inline-start:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--ember),#ff4d8d);color:#fff;font-weight:700;border-radius:28px;padding:13px 22px;box-shadow:0 8px 22px rgba(255,90,90,.45);z-index:3}
nav{position:absolute;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:4}
nav button{flex:1;padding:8px 0;border-radius:22px;color:var(--mut);display:flex;flex-direction:column;align-items:center;font-size:.74rem}
nav button span{font-size:1.3rem}nav button.on{background:var(--ember);color:var(--on);font-weight:700}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:8}.shade.on{display:flex}
.sheet{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet h2{margin-bottom:14px;color:var(--gold)}.sheet label{display:block;margin-bottom:12px;color:var(--mut);font-size:.9rem}
.sheet input,.sheet select{display:block;width:100%;margin-top:5px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}
.cta{background:linear-gradient(135deg,var(--ember),#ff4d8d);color:#fff;font-weight:700;border-radius:16px;padding:12px 20px;width:100%}
.toast{position:absolute;inset-inline:18px;bottom:100px;background:var(--surf2);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;display:none;z-index:9;text-align:center}.toast.on{display:block}
/* room */
#room{background:radial-gradient(110% 40% at 50% 0,var(--g2) 0,var(--bg) 70%)}
#room header{display:flex;align-items:center;gap:10px;padding:12px 16px}
#room header h2{font-size:1.2rem;flex:1}
.ib{width:42px;height:42px;flex:none;border-radius:50%;background:var(--surf);border:1px solid var(--line);font-size:1.15rem}
.ib.live{background:var(--mint);color:#06291f;border-color:var(--mint)}
.badge{font-size:.78rem;background:rgba(0,0,0,.3);border-radius:12px;padding:3px 11px;color:#fff}
.video{margin:0 16px 8px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:10px;display:none}.video.on{display:block}
.video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:none;margin-bottom:8px}
.vr{display:flex;gap:8px}.vr input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}.vr .cta{width:auto;padding:9px 16px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 16px 10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.76rem;color:var(--mut)}
.seat .e{width:60px;height:60px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:1.5rem}
.seat .av{border:2px solid var(--gold)}.seat.talk .av{animation:rg 1.2s infinite}
@keyframes rg{50%{box-shadow:0 0 0 8px rgba(79,227,193,.4)}}
.chatbox{flex:1;min-height:0;overflow-y:auto;padding:0 16px;display:flex;flex-direction:column;gap:7px}
.m{display:flex;gap:8px;align-items:flex-end}.m span{background:var(--surf);border-radius:16px 16px 16px 4px;padding:7px 13px;max-width:78%;font-size:.93rem}.m b{color:var(--mint);margin-inline-end:6px}
.m.me{flex-direction:row-reverse}.m.me span{background:var(--ember);color:#fff;border-radius:16px 16px 4px 16px}
.bar{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar input{flex:1;min-width:0;background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:10px 16px}
.fly{position:fixed;font-size:2.6rem;pointer-events:none;animation:fl 1.6s ease-out forwards;z-index:20}
@keyframes fl{to{transform:translateY(-50vh) scale(1.5);opacity:0}}
.empty{text-align:center;padding:36px 16px;color:var(--mut);line-height:1.8}.empty b{display:block;color:var(--tx);font-size:1.1rem}.empty .cta{width:auto;margin-top:14px}
.gbody{flex:1;overflow-y:auto;padding:8px 18px 24px}
.logo{font-size:5rem;text-align:center;background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:26px;margin:10px 0 16px}
.score{display:flex;justify-content:space-between;color:var(--mut)}
.opt{display:block;width:100%;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;font-weight:700}
.opt.ok{background:var(--mint);color:#06291f;border-color:var(--mint)}.opt.no{background:#ef4444;color:#fff;border-color:#ef4444}
.wres{display:block;color:inherit;text-decoration:none;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;line-height:1.7}.wres b{color:var(--gold)}
button.pill{color:inherit}
.pk{grid-template-columns:1fr 1fr 1fr}
.pk button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.pk button:hover{border-color:var(--gold)}.pk .e{font-size:1.8rem}.pk b{font-size:1.1rem;color:var(--gold)}.pk small{color:var(--mut)}
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:34vh;overflow-y:auto}
.gi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:16px;background:var(--surf);border:2px solid transparent;font-size:.74rem}
.gi .e{font-size:1.9rem}.gi small{color:var(--gold)}.gi.on{border-color:var(--gold);background:var(--surf2)}
.gfoot{display:flex;gap:8px;align-items:center;margin-top:12px}.gfoot .cta{flex:1}
.qty{display:flex;gap:6px}.qty button{padding:9px 12px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}.qty button.on{background:var(--gold);color:var(--on);font-weight:700}
.m.gift span{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff}
.bigfx{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none;text-align:center;background:radial-gradient(circle,rgba(255,196,107,.4),transparent 65%);animation:bf 2.5s ease-out forwards}
.bigfx span{font-size:9rem;display:block;line-height:1.2;animation:bz 2.5s ease-out forwards}
.bigfx b{font-family:"Reem Kufi",sans-serif;font-size:1.4rem;color:#fff;text-shadow:0 2px 12px #000}
@keyframes bf{0%,80%{opacity:1}100%{opacity:0}}@keyframes bz{0%{transform:scale(.2) rotate(-12deg)}30%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bigfx span,.fly{animation:none}}
.roar{position:fixed;inset:0;z-index:30;pointer-events:none;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,rgba(255,150,40,.35),transparent 70%);animation:bf 2.8s ease-out forwards}
.roar .ring{position:absolute;width:40px;height:40px;border-radius:50%;border:4px solid #ffc46b;opacity:0;animation:rr 1.6s ease-out infinite}
.roar .ring:nth-child(2){animation-delay:.3s}.roar .ring:nth-child(3){animation-delay:.6s}
@keyframes rr{0%{transform:scale(1);opacity:.9}100%{transform:scale(22);opacity:0}}
.roar .lion{width:min(80vw,380px);border-radius:18px;filter:drop-shadow(0 0 30px #ffb347);animation:ln 2.8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ln{0%{transform:translateX(-120vw) scale(.6)}30%{transform:translateX(0) scale(1.25)}45%{transform:scale(1)}100%{transform:scale(1.1)}}
.roar b{position:absolute;bottom:22%;font-family:"Reem Kufi",sans-serif;font-size:2rem;color:#ffe2a8;text-shadow:0 3px 14px #000}
.shake{animation:sk .5s 2}@keyframes sk{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,-2px)}}
.vipin{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:25;pointer-events:none;border-radius:30px;padding:10px 18px;text-align:center;font-weight:700;color:#3a2200;background:linear-gradient(100deg,#b8741a,#ffd77a 40%,#fff1c2 50%,#ffd77a 60%,#b8741a);background-size:200% 100%;box-shadow:0 0 24px rgba(255,196,107,.7);animation:vi 3.4s ease forwards,shn 1.4s linear infinite}
@keyframes vi{0%{transform:translateX(110%);opacity:0}15%,80%{transform:none;opacity:1}100%{transform:translateX(-110%);opacity:0}}
@keyframes shn{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.roar .ring{display:none}.vipin,.shake{animation:none}}
#aform{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin:14px auto 0}
#aform input{padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:inherit;font:inherit}
.alink{background:none;border:0;color:inherit;opacity:.8;font:inherit;text-decoration:underline;padding:6px}
</style>
</head>
<body>

<section id="login" class="view on">
  <svg class="art" viewBox="0 0 340 200" aria-hidden="true">
    <circle cx="240" cy="62" r="34" fill="#ffd48a"/><circle cx="252" cy="54" r="31" fill="#2a1560"/>
    <g fill="#ffd48a"><circle cx="60" cy="40" r="2"/><circle cx="120" cy="22" r="1.5"/><circle cx="170" cy="58" r="2"/><circle cx="30" cy="90" r="1.5"/><circle cx="300" cy="120" r="2"/></g>
    <path d="M0 150C60 100 120 112 180 136S290 128 340 100V200H0Z" fill="#ff7a45"/>
    <path d="M0 176C70 140 140 152 210 170S300 160 340 148V200H0Z" fill="#ffc46b"/>
  </svg>
  <h1 class="brand">صحراء</h1>
  <p>غرف صوتية، ألعاب، وأفلام تشاهدونها معاً.</p>
  <form id="aform" autocomplete="on">
    <input id="em" type="email" dir="ltr" required placeholder="البريد الإلكتروني (Gmail)" autocomplete="email">
    <input id="pw" type="password" dir="ltr" required minlength="6" placeholder="كلمة المرور" autocomplete="new-password">
    <input id="cpw" type="password" dir="ltr" placeholder="تأكيد كلمة المرور" autocomplete="new-password">
    <button class="cta" id="asub" type="submit">إنشاء حساب</button>
    <button class="alink" id="atog" type="button">لدي حساب بالفعل</button>
  </form>
  <p class="fine">بالمتابعة توافق على شروط الاستخدام وسياسة الخصوصية.</p>
</section>

<section id="app" class="view">
  <header><span class="av" style="--h:20" id="hav">😎</span><div class="hi"><small>مساء الخير</small><h2 id="hname">أنت</h2></div><button class="pill" data-shop aria-label="شحن الجواهر">💎 <span class="gems">0</span></button></header>
  <main>
    <div class="tab on" id="t-rooms">
      <div class="chips" id="chips"></div>
      <div id="hero"></div>
      <div class="sec"><h3>غرف مباشرة</h3><span id="rcount"></span></div>
      <div id="rlist"></div>
    </div>
    <div class="tab" id="t-games"><div class="grid" id="games"></div></div>
    <div class="tab" id="t-msgs"><div class="sec"><h3>المحادثات</h3></div><div id="chats"></div></div>
    <div class="tab" id="t-prof">
      <div class="cover"></div>
      <div class="prof"><span class="av" style="--s:96px;--h:20">😎</span><h3 id="uname">أنت</h3><p id="umail">you@gmail.com</p></div>
      <div class="stats"><div><b>0</b><small>صديق</small></div><div><b>0</b><small>غرفة</small></div><div><b>0</b><small>المستوى</small></div></div>
      <button class="row" data-shop>💎 شحن الجواهر</button>
      <button class="row" data-toast="تعديل الملف الشخصي يأتي لاحقاً">✏️ تعديل الملف الشخصي</button>
      <button class="row" data-toast="قائمة الأصدقاء تأتي لاحقاً">👥 الأصدقاء</button>
      <button class="row out" id="logout">تسجيل الخروج</button>
    </div>
  </main>
  <button class="fab" id="fab" data-open>＋ غرفة جديدة</button>
  <nav>
    <button class="on" data-tab="rooms"><span>🎙️</span>الغرف</button>
    <button data-tab="games"><span>🎮</span>الألعاب</button>
    <button data-tab="msgs"><span>💬</span>الرسائل</button>
    <button data-tab="prof"><span>👤</span>أنت</button>
  </nav>
  <div class="shade" id="sheet">
    <form class="sheet" id="form">
      <h2>غرفة جديدة</h2>
      <label>اسم الغرفة<input id="rn" required maxlength="40" placeholder="مثال: سمر الجمعة"></label>
      <label>نوع الغرفة<select id="rt"><option>صوتية</option><option>سينما</option><option>ألعاب</option></select></label>
      <button class="cta" type="submit">إنشاء الغرفة</button>
    </form>
  </div>
</section>

<section id="room" class="view" style="--g2:#3a1d7a">
  <header><button class="ib" id="back" aria-label="رجوع">➜</button><h2 id="rtitle"></h2><span class="badge" id="rbadge"></span></header>
  <div class="video" id="video">
    <iframe id="yt" allowfullscreen title="مشغل يوتيوب"></iframe>
    <div class="vr"><input id="yurl" placeholder="الصق رابط يوتيوب هنا" dir="ltr"><button class="cta" id="play">تشغيل</button></div>
  </div>
  <div class="seats" id="seats"></div>
  <div class="chatbox" id="cb" aria-live="polite"></div>
  <div class="bar">
    <button class="ib" id="mic" aria-label="المايك">🎙️</button>

 const{data}=await sb.from("messages").select("id,body,kind,profiles(name)").eq("room_id",r.id).order("created_at",{ascending:false}).limit(50);
 (data||[]).reverse().forEach(m=>addMsg(m.body,m.kind==="gift"?"gift":"",(m.profiles&&m.profiles.name)||"",m.id))}

const TURN_HOST="",TURN_USER="",TURN_PASS="";
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}].concat(TURN_HOST?[{urls:["turn:"+TURN_HOST+":80","turn:"+TURN_HOST+":443","turn:"+TURN_HOST+":443?transport=tcp","turns:"+TURN_HOST+":443?transport=tcp"],username:TURN_USER,credential:TURN_PASS}]:[])};
async function startMic(){try{lstream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast("اسمح بالمايك (يتطلب رابط HTTPS)");return false}
 const t=lstream.getAudioTracks()[0];t.enabled=false;Object.values(pcs).forEach(p=>p.tx.sender.replaceTrack(t));return true}
function stopMic(){micOn=false;$("#mic").classList.remove("live");if(lstream){lstream.getTracks().forEach(t=>t.stop());lstream=null}Object.values(pcs).forEach(p=>p.tx.sender.replaceTrack(null).catch(()=>{}))}
async function takeSeat(i,x){if(!cur)return;
 if(mySeat===i){stopMic();await sb.from("room_seats").delete().eq("room_id",cur.id).eq("user_id",ME.id);return}
 if(x){toast("المقعد مشغول");return}
 if(mySeat!==null){stopMic();await sb.from("room_seats").delete().eq("room_id",cur.id).eq("user_id",ME.id)}
 const{error}=await sb.from("room_seats").insert({room_id:cur.id,seat:i+1,user_id:ME.id});if(error)toast("تعذر الجلوس: "+error.message)}
async function loadSeats(){if(!cur)return;const{data}=await sb.from("room_seats").select("seat,user_id,muted,profiles(name,is_vip)").eq("room_id",cur.id);
 SEATS=[];(data||[]).forEach(q=>{SEATS[q.seat-1]={user_id:q.user_id,muted:q.muted,name:esc((q.profiles&&q.profiles.name)||"مستخدم"),vip:q.profiles&&q.profiles.is_vip}});seats()}
const sig=(to,type,data)=>vc&&vc.send({type:"broadcast",event:"sig",payload:{to,from:ME.id,type,data}});
function mkPc(id){const pc=new RTCPeerConnection(ICE),tx=pc.addTransceiver("audio",{direction:"sendrecv"});
 if(lstream)tx.sender.replaceTrack(lstream.getAudioTracks()[0]);
 const o={pc,tx,q:[]};pcs[id]=o;
 pc.onconnectionstatechange=()=>{const st=pc.connectionState;if(st==="failed")retry(id,pc);else if(st==="disconnected")setTimeout(()=>{if(pc.connectionState!=="connected")retry(id,pc)},4000)};
 pc.onicecandidate=e=>{if(e.candidate)sig(id,"ice",e.candidate)};
 pc.ontrack=e=>{let a=aud[id];if(!a){a=aud[id]=new Audio();a.autoplay=true}a.srcObject=e.streams[0]||new MediaStream([e.track]);a.play().catch(()=>{})};
 return o}
function retry(id,pc){if(!pcs[id]||pcs[id].pc!==pc)return;dropPc(id);if(PR.has(id)&&ME.id>id)offer(id).catch(()=>{})}
window.addEventListener("online",()=>{if(!vc)return;Object.keys(pcs).forEach(id=>retry(id,pcs[id].pc));try{vc.track({t:Date.now()})}catch(e){}});
function dropPc(id){const o=pcs[id];if(o){o.pc.close();delete pcs[id]}if(aud[id]){aud[id].srcObject=null;delete aud[id]}}
const flush=o=>{o.q.forEach(c=>o.pc.addIceCandidate(c).catch(()=>{}));o.q=[]};
async function onSig({to,from,type,data}){if(to!==ME.id)return;
 if(type==="offer"){dropPc(from);const o=mkPc(from);await o.pc.setRemoteDescription(data);flush(o);const a=await o.pc.createAnswer();await o.pc.setLocalDescription(a);sig(from,"answer",o.pc.localDescription)}
 else if(type==="answer"){const o=pcs[from];if(o){await o.pc.setRemoteDescription(data);flush(o)}}
 else if(type==="ice"){const o=pcs[from];if(!o)return;o.pc.remoteDescription?o.pc.addIceCandidate(data).catch(()=>{}):o.q.push(data)}}
async function offer(id){const o=mkPc(id),d=await o.pc.createOffer();await o.pc.setLocalDescription(d);sig(id,"offer",o.pc.localDescription)}
async function joinVoice(r){leaveVoice();await sb.from("room_seats").delete().eq("room_id",r.id).eq("user_id",ME.id);
 vc=sb.channel("vc-"+r.id,{config:{presence:{key:ME.id},broadcast:{self:false}}});
 vc.on("broadcast",{event:"sig"},({payload})=>{chain=chain.then(()=>onSig(payload)).catch(()=>{})});
 vc.on("presence",{event:"sync"},()=>{const ids=Object.keys(vc.presenceState());PR=new Set(ids);$("#rbadge").textContent=r.t+" · "+ids.length+" متصل";
  ids.forEach(id=>{if(id!==ME.id&&ME.id>id&&!pcs[id])offer(id).catch(()=>{})});Object.keys(pcs).forEach(id=>{if(!PR.has(id))dropPc(id)});seats()});
 await vc.subscribe(st=>{if(st==="SUBSCRIBED")vc.track({t:Date.now()})});
 seatCh=sb.channel("seats-"+r.id).on("postgres_changes",{event:"*",schema:"public",table:"room_seats"},()=>loadSeats()).subscribe();loadSeats()}
function leaveVoice(){stopMic();Object.keys(pcs).forEach(dropPc);if(vc){sb.removeChannel(vc);vc=null}if(seatCh){sb.removeChannel(seatCh);seatCh=null}SEATS=[];PR=new Set()}
let signup=true;
const authMode=()=>{$("#cpw").style.display=signup?"":"none";$("#cpw").required=signup;$("#asub").textContent=signup?"إنشاء حساب":"تسجيل الدخول";$("#atog").textContent=signup?"لدي حساب بالفعل":"إنشاء حساب جديد"};
$("#atog").onclick=()=>{signup=!signup;authMode()};
$("#aform").onsubmit=async e=>{e.preventDefault();const em=$("#em").value.trim(),pw=$("#pw").value,btn=$("#asub");
 if(signup&&pw!==$("#cpw").value){toast("كلمتا المرور غير متطابقتين");return}
 if(pw.length<6){toast("كلمة المرور 6 أحرف على الأقل");return}
 btn.disabled=true;
 try{
  if(!signup){
   const r=await sb.auth.signInWithPassword({email:em,password:pw});
   if(r.error){toast(/Invalid login/.test(r.error.message)?"البريد أو كلمة المرور غير صحيحة":/not confirmed/i.test(r.error.message)?"البريد غير مؤكد: عطّل Confirm email في Supabase":r.error.message);return}
   await enterApp(r.data.user);return}
  const r=await sb.auth.signUp({email:em,password:pw});
  if(r.error){toast(/already registered/i.test(r.error.message)?"هذا الحساب موجود بالفعل":/rate limit/i.test(r.error.message)?"عطّل Confirm email في Supabase ثم أعد المحاولة":r.error.message);return}
  if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){toast("هذا الحساب موجود بالفعل");return}
  let u=r.data.session&&r.data.user;
  if(!u){const l=await sb.auth.signInWithPassword({email:em,password:pw});if(l.error){toast("عطّل Confirm email في Supabase ليدخل الحساب مباشرة");return}u=l.data.user}
  await enterApp(u)
 }finally{btn.disabled=false}};
authMode();
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")show("login")});
sb.auth.getSession().then(({data})=>{if(data.session)enterApp(data.session.user)});
</script>
</body>
